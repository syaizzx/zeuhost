name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build all packages & generate Prisma client
        run: npm run build:deps

      - name: Build Next.js web application
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci_test_secret_32_characters_minimum
          BETTER_AUTH_URL: http://localhost:3000
